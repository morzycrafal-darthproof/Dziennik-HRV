<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123A33">
<title>Dziennik ciśnienia</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --tlo:#e9eeec;
  --karta:#ffffff;
  --atrament:#12241f;
  --przygaszony:#5d6f6a;
  --linia:#d3dcd9;
  --zielen:#2f6f62;
  --zielen-ciemna:#123a33;
  --bursztyn:#b3862a;
  --czerwien:#9c2f3c;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--tlo);
  color:var(--atrament);
  font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.45;
  padding:0 14px calc(80px + env(safe-area-inset-bottom));   /* miejsce na dolną nawigację */
  max-width:620px;margin:0 auto;
}
h1{font-size:1.05rem;font-weight:600;letter-spacing:.01em;margin:0}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:12px 2px 8px}
header span{font-size:.82rem;color:var(--przygaszony)}
.karta{background:var(--karta);border-radius:var(--r);padding:16px;margin-bottom:10px;border:1px solid var(--linia)}

/* --- stan bieżący --- */
.stan{background:var(--zielen-ciemna);color:#eef4f2;border:none;padding:16px 18px}
.stan .odczyt{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.stan .liczby{font-size:2.5rem;font-weight:600;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stan .jedn{font-size:.85rem;opacity:.7;padding-bottom:.4rem}
.stan .kiedy{font-size:.85rem;opacity:.75;margin-top:8px}
.plakietka{display:inline-block;margin-top:8px;padding:5px 11px;border-radius:999px;font-size:.82rem;font-weight:600;color:#fff}
.dzis-tytul{font-size:.78rem;opacity:.7;margin-top:12px;margin-bottom:6px}
.dzis{display:flex;gap:8px}
.dzis>*{
  flex:1;min-width:0;text-align:left;font:inherit;font-size:.78rem;color:inherit;
  padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.08);
  border:none;border-left:4px solid transparent
}
.dzis b{display:block;font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums;margin:2px 0 1px}
.dzis small{display:block;font-size:.72rem;opacity:.7}
.dzis .brak{background:none;border:1px dashed rgba(255,255,255,.35);cursor:pointer;opacity:.85}
.dzis .brak b{font-weight:500;opacity:.8}
.srednie{display:flex;gap:22px;margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.18);flex-wrap:wrap}
.srednie div{font-size:.82rem;opacity:.8}
.srednie b{display:block;font-size:1.25rem;font-weight:600;opacity:1;font-variant-numeric:tabular-nums;margin-top:2px}

/* --- formularz --- */
label{display:block;font-size:.8rem;color:var(--przygaszony);margin-bottom:5px}
.rzad{display:flex;gap:10px;margin-bottom:10px}
.rzad>div{flex:1;min-width:0}
input,select,textarea{
  width:100%;font:inherit;color:var(--atrament);background:#f6f8f7;
  border:1px solid var(--linia);border-radius:10px;padding:9px 12px;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--zielen);outline-offset:1px;background:#fff}
input[type=number]{font-variant-numeric:tabular-nums}
.pory{display:flex;gap:8px}
.pory button{
  flex:1;padding:9px 4px;border-radius:10px;border:1px solid var(--linia);
  background:#f6f8f7;font:inherit;font-size:.9rem;color:var(--przygaszony);cursor:pointer
}
.pory button[aria-pressed=true]{background:var(--zielen);border-color:var(--zielen);color:#fff;font-weight:600}
.zapisz{
  width:100%;margin-top:4px;padding:12px;border:none;border-radius:10px;
  background:var(--zielen-ciemna);color:#fff;font:inherit;font-weight:600;cursor:pointer
}
.zapisz:active{transform:translateY(1px)}
.blad{color:var(--czerwien);font-size:.85rem;margin-top:6px;min-height:1.2em}

/* --- wykres --- */
.naglowek-sekcji{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.naglowek-sekcji h2{font-size:.95rem;font-weight:600;margin:0}
.naglowek-sekcji small{color:var(--przygaszony);font-size:.8rem}
svg{width:100%;height:auto;display:block}
.legenda{display:flex;gap:16px;margin-top:10px;font-size:.78rem;color:var(--przygaszony)}
.legenda i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}

/* --- lista --- */
.dzien{font-size:.8rem;color:var(--przygaszony);margin:18px 0 8px;padding-left:2px}
.wpis{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--linia)}
.wpis:last-child{border-bottom:none}
.pasek{width:4px;align-self:stretch;border-radius:2px;flex:none}
.wpis .wartosc{font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums;min-width:104px}
.wpis .meta{flex:1;font-size:.82rem;color:var(--przygaszony);min-width:0}
.wpis .meta em{font-style:normal;display:block;color:var(--atrament);opacity:.75;word-break:break-word}
.usun{background:none;border:none;color:var(--przygaszony);font-size:1.1rem;padding:6px 4px;cursor:pointer;flex:none}
.pusto{color:var(--przygaszony);font-size:.9rem;text-align:center;padding:24px 8px}
.narzedzia{display:flex;flex-wrap:wrap;gap:10px}
.narzedzia button{
  flex:1;padding:12px;border-radius:10px;border:1px solid var(--linia);
  background:var(--karta);font:inherit;font-size:.88rem;color:var(--atrament);cursor:pointer
}
.narzedzia .glowny{flex-basis:100%;border-color:var(--zielen);color:var(--zielen);font-weight:600}
.przypomnienie{
  display:flex;align-items:center;gap:12px;margin-bottom:14px;padding:12px 14px;
  background:var(--karta);border:1px solid var(--linia);border-left:4px solid var(--bursztyn);
  border-radius:var(--r);font-size:.88rem
}
.przypomnienie[hidden]{display:none}
.przypomnienie span{flex:1}
.przypomnienie button{
  flex:none;padding:8px 12px;border-radius:8px;border:1px solid var(--bursztyn);background:none;
  font:inherit;font-size:.85rem;font-weight:600;color:var(--atrament);cursor:pointer
}
footer{font-size:.76rem;color:var(--przygaszony);text-align:center;padding:6px 10px 0;line-height:1.5}

/* --- strony i dolna nawigacja --- */
.strona[hidden]{display:none}
.opis{font-size:.88rem;color:var(--przygaszony);margin:0 0 12px}
.nawigacja{
  position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;
  background:var(--karta);border-top:1px solid var(--linia);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom))
}
.nawigacja button{
  flex:1;max-width:150px;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 4px;border:none;border-radius:12px;background:none;cursor:pointer;
  font:inherit;font-size:.74rem;color:var(--przygaszony)
}
.nawigacja svg{
  width:44px;height:28px;padding:4px 10px;border-radius:999px;
  fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round
}
.nawigacja button[aria-current=page]{color:var(--zielen-ciemna);font-weight:600}
.nawigacja button[aria-current=page] svg{background:var(--tlo)}

/* --- raport dla lekarza --- */
.raport-pasek .rzad{margin-bottom:10px}
#raport-tresc{
  background:var(--karta);color:var(--atrament);border:1px solid var(--linia);border-radius:var(--r);
  padding:18px 16px;font-size:.85rem;line-height:1.35
}
.r-naglowek{border-bottom:2px solid var(--atrament);padding-bottom:8px;margin-bottom:14px}
.r-naglowek h1{font-size:1.15rem;margin:0 0 6px}
.r-sekcja{margin-bottom:18px}
.r-sekcja h2{font-size:.95rem;font-weight:600;margin:0 0 6px}
.r-tabela{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.r-tabela th,.r-tabela td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--linia);vertical-align:top}
.r-tabela thead th{border-bottom:1.5px solid var(--atrament);font-size:.78rem}
.r-tabela tr{break-inside:avoid}
.r-zwarta th{font-weight:normal;color:var(--przygaszony);width:40%}
.r-dzienna td:first-child{white-space:nowrap;width:16%}
.r-dzienna td{width:42%}
.r-pomiar+.r-pomiar{margin-top:4px}
.r-maly{font-size:.75rem;color:var(--przygaszony)}
.r-sekcja>.r-maly{margin:0 0 4px}
.r-notatka{font-size:.72rem;color:var(--przygaszony);font-style:italic}
.r-podsumowanie,.r-tygodnie,.r-wykres{break-inside:avoid}
.r-legenda{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:6px;font-size:.75rem;color:var(--przygaszony)}
.r-legenda span{display:inline-flex;align-items:center;gap:5px}
.r-legenda svg{width:auto;display:inline}
.r-stopka{font-size:.72rem;color:var(--przygaszony);margin-top:14px}

@media print{
  @page{size:A4;margin:14mm 12mm}
  body{max-width:none;padding:0;background:#fff}
  header,.nawigacja,.raport-pasek{display:none}
  #raport-tresc{border:none;border-radius:0;padding:0;font-size:9.5pt}
}
</style>
</head>
<body>

<header>
  <h1>Dziennik ciśnienia</h1>
  <span id="licznik"></span>
</header>

<main class="strona" id="strona-pomiar">
  <section class="karta stan" id="stan"></section>

  <div class="przypomnienie" id="przypomnienie-kopii" role="status" hidden></div>

  <section class="karta">
    <div class="rzad">
      <div>
        <label for="data">Data</label>
        <input type="date" id="data">
      </div>
      <div>
        <label for="godzina">Godzina</label>
        <input type="time" id="godzina">
      </div>
    </div>

    <div class="rzad">
      <div>
        <label for="skurczowe">Górne (skurczowe)</label>
        <input type="number" id="skurczowe" inputmode="numeric" min="50" max="300" placeholder="120">
      </div>
      <div>
        <label for="rozkurczowe">Dolne (rozkurczowe)</label>
        <input type="number" id="rozkurczowe" inputmode="numeric" min="30" max="200" placeholder="80">
      </div>
      <div>
        <label for="tetno">Tętno</label>
        <input type="number" id="tetno" inputmode="numeric" min="20" max="250" placeholder="—">
      </div>
    </div>

    <label>Pora pomiaru</label>
    <div class="pory" id="pory" style="margin-bottom:12px">
      <button type="button" data-pora="rano" aria-pressed="true">Rano</button>
      <button type="button" data-pora="wieczór" aria-pressed="false">Wieczór</button>
      <button type="button" data-pora="dodatkowy" aria-pressed="false">Dodatkowy</button>
    </div>

    <label for="notatka">Notatka (opcjonalnie)</label>
    <input type="text" id="notatka" placeholder="np. po kawie, przed lekami">

    <div class="blad" id="blad"></div>
    <button class="zapisz" id="zapisz">Zapisz pomiar</button>
  </section>
</main>

<main class="strona" id="strona-historia" hidden>
  <section class="karta" id="karta-wykresu">
    <div class="naglowek-sekcji">
      <h2>Przebieg</h2>
      <small id="zakres-wykresu"></small>
    </div>
    <div id="wykres"></div>
    <div class="legenda">
      <span><i style="background:#123a33"></i>górne</span>
      <span><i style="background:#7fae9f"></i>dolne</span>
    </div>
  </section>

  <section class="karta">
    <div class="naglowek-sekcji">
      <h2>Historia</h2>
      <small id="podsumowanie-historii"></small>
    </div>
    <div id="lista"></div>
  </section>
</main>

<main class="strona" id="strona-raport" hidden>
  <section class="karta raport-pasek">
    <div class="rzad">
      <div>
        <label for="raport-od">Od</label>
        <input type="date" id="raport-od">
      </div>
      <div>
        <label for="raport-do">Do</label>
        <input type="date" id="raport-do">
      </div>
    </div>
    <label for="raport-pacjent">Imię i nazwisko (opcjonalnie)</label>
    <input type="text" id="raport-pacjent" autocomplete="name">
    <button type="button" class="zapisz" id="raport-drukuj" style="margin-top:12px">Drukuj / zapisz PDF</button>
  </section>
  <div id="raport-tresc"></div>
</main>

<main class="strona" id="strona-kopia" hidden>
  <section class="karta">
    <div class="naglowek-sekcji">
      <h2>Kopia zapasowa</h2>
    </div>
    <p class="opis" id="stan-kopii"></p>
    <div class="narzedzia">
      <button class="glowny" data-akcja="wyslij-kopie">Wyślij kopię</button>
      <button id="eksport">Eksportuj CSV</button>
      <button id="import">Wczytaj CSV</button>
    </div>
    <input type="file" id="plik" accept=".csv,text/csv" hidden>
  </section>

  <footer>
    Dane zapisują się tylko w pamięci tej przeglądarki. Rób kopię przyciskiem „Wyślij kopię”.<br>
    Aplikacja pomaga notować pomiary — nie służy do oceny stanu zdrowia.
  </footer>
</main>

<nav class="nawigacja" id="nawigacja" aria-label="Sekcje aplikacji">
  <button type="button" data-strona="pomiar" aria-current="page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Pomiar
  </button>
  <button type="button" data-strona="historia">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg>Historia
  </button>
  <button type="button" data-strona="raport">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l4 4v14H7zM14 3v4h4M10 12h5M10 16h5"/></svg>Raport
  </button>
  <button type="button" data-strona="kopia">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4M5 14v5h14v-5"/></svg>Kopia
  </button>
</nav>

<script>
const KLUCZ = 'pomiary-cisnienia-v1';
const PORY = ['rano','wieczór','dodatkowy'];
let pomiary = [];
let pora = 'rano';

/* ---------- dane ---------- */
function wczytaj(){
  try{ pomiary = JSON.parse(localStorage.getItem(KLUCZ) || '[]'); }
  catch(e){ pomiary = []; }
  pomiary.sort((a,b)=> (b.data+b.godzina).localeCompare(a.data+a.godzina));
}
function zapisz(){ localStorage.setItem(KLUCZ, JSON.stringify(pomiary)); }

/* ---------- klasyfikacja (wg wyższej z dwóch wartości) ---------- */
const KATEGORIE = [
  {nazwa:'niskie',              max:[89,59],   kolor:'#4b7fa8'},
  {nazwa:'optymalne',           max:[119,79],  kolor:'#2f6f62'},
  {nazwa:'prawidłowe',          max:[129,84],  kolor:'#5a8f52'},
  {nazwa:'wysokie prawidłowe',  max:[139,89],  kolor:'#b3862a'},
  {nazwa:'nadciśnienie 1°',     max:[159,99],  kolor:'#c46a2c'},
  {nazwa:'nadciśnienie 2°',     max:[179,109], kolor:'#9c2f3c'},
  {nazwa:'nadciśnienie 3°',     max:[999,999], kolor:'#6d1f2a'}
];
function kategoria(s,r){
  if(s<90 && r<60) return KATEGORIE[0];
  for(let i=1;i<KATEGORIE.length;i++){
    if(s<=KATEGORIE[i].max[0] && r<=KATEGORIE[i].max[1]) return KATEGORIE[i];
  }
  return KATEGORIE[KATEGORIE.length-1];
}

/* ---------- pomocnicze ---------- */
const dni = ['niedziela','poniedziałek','wtorek','środa','czwartek','piątek','sobota'];
const miesiace = ['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];
function opisDaty(iso){
  const d = new Date(iso+'T12:00:00');
  const dzis = new Date(); dzis.setHours(12,0,0,0);
  const roznica = Math.round((dzis-d)/86400000);
  if(roznica===0) return 'Dzisiaj';
  if(roznica===1) return 'Wczoraj';
  return dni[d.getDay()] + ', ' + d.getDate() + ' ' + miesiace[d.getMonth()];
}
function dwacyfry(n){ return String(n).padStart(2,'0'); }
function ilePomiarow(n){
  const j = n%10, d = n%100;
  return n + (n===1 ? ' pomiar' : (j>=2 && j<=4 && (d<12 || d>14)) ? ' pomiary' : ' pomiarów');
}
function isoDaty(t){ return t.getFullYear()+'-'+dwacyfry(t.getMonth()+1)+'-'+dwacyfry(t.getDate()); }

/* ---------- średnie ---------- */
// Pomiary z dni kalendarzowych od–do (włącznie, daty ISO).
function pomiaryZOkresu(od, doDnia){
  return pomiary.filter(x => x.data>=od && x.data<=doDnia);
}
// Średnia liczy tylko pomiary poranne i wieczorne — dodatkowe (przy objawach) są pomijane.
function srednie(lista){
  const zRytmu = lista.filter(x => x.pora!=='dodatkowy');
  const sr = (wpisy, pole) => wpisy.length ? Math.round(wpisy.reduce((a,x)=>a+x[pole],0)/wpisy.length) : '—';
  return {
    skurczowe: sr(zRytmu, 'skurczowe'),
    rozkurczowe: sr(zRytmu, 'rozkurczowe'),
    tetno: sr(zRytmu.filter(x=>x.tetno), 'tetno'),
    ile: zRytmu.length
  };
}

/* ---------- widok: dzisiejszy rytm (rano / wieczór / dodatkowe) ---------- */
function htmlDzis(){
  const dzisiaj = pomiary.filter(x=>x.data===isoDaty(new Date()));
  const kafel = (nazwa, klucz) => {
    const p = dzisiaj.find(x=>x.pora===klucz); // lista jest malejąca, więc to najnowszy
    if(!p) return '<button type="button" class="brak" data-pora="'+klucz+'">'+nazwa+'<b>brak</b><small>dotknij, aby wpisać</small></button>';
    const k = kategoria(p.skurczowe, p.rozkurczowe);
    return '<div style="border-left-color:'+k.kolor+'">'+nazwa+'<b>'+p.skurczowe+'/'+p.rozkurczowe+'</b><small>'+p.godzina+'</small></div>';
  };
  const dodatkowe = dzisiaj.filter(x=>x.pora==='dodatkowy').length;
  return '<div class="dzis-tytul">Dziś'+(dodatkowe?' · dodatkowe: '+dodatkowe:'')+'</div>'+
    '<div class="dzis">'+kafel('Rano','rano')+kafel('Wieczór','wieczór')+'</div>';
}

/* ---------- widok: stan bieżący ---------- */
function rysujStan(){
  const el = document.getElementById('stan');
  document.getElementById('licznik').textContent =
    pomiary.length ? ilePomiarow(pomiary.length) : '';

  if(!pomiary.length){
    el.innerHTML = '<div class="kiedy" style="margin:0">Brak pomiarów. Wpisz pierwszy wynik poniżej — data i godzina są już ustawione na teraz.</div>';
    return;
  }
  const p = pomiary[0];
  const k = kategoria(p.skurczowe, p.rozkurczowe);

  const t = new Date();
  const ostatnie = pomiaryZOkresu(isoDaty(new Date(t.getFullYear(), t.getMonth(), t.getDate()-6)), isoDaty(t));
  const sr = srednie(ostatnie);

  el.innerHTML =
    '<div class="odczyt"><span class="liczby">'+p.skurczowe+'/'+p.rozkurczowe+'</span>'+
    '<span class="jedn">mmHg'+(p.tetno?' · tętno '+p.tetno:'')+'</span></div>'+
    '<div class="kiedy">'+opisDaty(p.data)+', '+p.godzina+' · '+p.pora+'</div>'+
    '<span class="plakietka" style="background:'+k.kolor+'">'+k.nazwa+'</span>'+
    htmlDzis()+
    '<div class="srednie">'+
      '<div>Średnia z 7 dni<b>'+sr.skurczowe+'/'+sr.rozkurczowe+'</b></div>'+
      '<div>Średnie tętno<b>'+sr.tetno+'</b></div>'+
      '<div>Pomiarów w 7 dni<b>'+ostatnie.length+'</b></div>'+
    '</div>';
}

/* ---------- widok: wykres ---------- */
function rysujWykres(){
  const karta = document.getElementById('karta-wykresu');
  const dane = pomiary.slice(0, 30).reverse();
  if(dane.length < 2){ karta.style.display='none'; return; }
  karta.style.display='';

  document.getElementById('zakres-wykresu').textContent =
    'ostatnie ' + ilePomiarow(dane.length);

  const W=600, H=220, ml=34, mr=8, mt=12, mb=22;
  const wszystkie = dane.flatMap(p=>[p.skurczowe,p.rozkurczowe]);
  let min = Math.min(...wszystkie, 70), max = Math.max(...wszystkie, 140);
  min = Math.floor((min-8)/10)*10; max = Math.ceil((max+8)/10)*10;
  const x = i => ml + i*(W-ml-mr)/(dane.length-1);
  const y = v => mt + (max-v)*(H-mt-mb)/(max-min);

  let siatka='';
  for(let v=min; v<=max; v+=20){
    siatka += '<line x1="'+ml+'" y1="'+y(v)+'" x2="'+(W-mr)+'" y2="'+y(v)+'" stroke="#e2e9e7" stroke-width="1"/>'+
              '<text x="4" y="'+(y(v)+4)+'" font-size="11" fill="#5d6f6a">'+v+'</text>';
  }
  // strefy odniesienia 120 i 80
  const linia = (v,kolor)=> (v>=min&&v<=max) ?
    '<line x1="'+ml+'" y1="'+y(v)+'" x2="'+(W-mr)+'" y2="'+y(v)+'" stroke="'+kolor+'" stroke-width="1" stroke-dasharray="4 4" opacity=".55"/>' : '';

  const sciezka = (pole) => dane.map((p,i)=> (i?'L':'M')+x(i).toFixed(1)+' '+y(p[pole]).toFixed(1)).join(' ');
  const punkty = (pole,kolor) => dane.map((p,i)=>'<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p[pole]).toFixed(1)+'" r="2.6" fill="'+kolor+'"/>').join('');

  const pierwszy = dane[0], ostatni = dane[dane.length-1];
  const etykieta = p => p.data.slice(8,10)+'.'+p.data.slice(5,7);

  document.getElementById('wykres').innerHTML =
    '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Wykres ciśnienia w czasie">'+
      siatka + linia(120,'#2f6f62') + linia(80,'#7fae9f') +
      '<path d="'+sciezka('skurczowe')+'" fill="none" stroke="#123a33" stroke-width="2.2" stroke-linejoin="round"/>'+
      '<path d="'+sciezka('rozkurczowe')+'" fill="none" stroke="#7fae9f" stroke-width="2.2" stroke-linejoin="round"/>'+
      punkty('skurczowe','#123a33') + punkty('rozkurczowe','#7fae9f')+
      '<text x="'+ml+'" y="'+(H-6)+'" font-size="11" fill="#5d6f6a">'+etykieta(pierwszy)+'</text>'+
      '<text x="'+(W-mr)+'" y="'+(H-6)+'" font-size="11" fill="#5d6f6a" text-anchor="end">'+etykieta(ostatni)+'</text>'+
    '</svg>';
}

/* ---------- CSV ---------- */
function csvDziennika(){
  const wiersze = [['data','godzina','skurczowe','rozkurczowe','tetno','pora','notatka']];
  [...pomiary].reverse().forEach(p=>wiersze.push([
    p.data,p.godzina,p.skurczowe,p.rozkurczowe,p.tetno||'',p.pora,(p.notatka||'').replace(/"/g,'""')
  ]));
  return '\uFEFF' + wiersze.map(w=>w.map(c=>'"'+c+'"').join(';')).join('\n');
}
function nazwaKopii(){ return 'cisnienie-'+isoDaty(new Date())+'.csv'; }

function pobierzKopie(){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csvDziennika()],{type:'text/csv;charset=utf-8'}));
  a.download = nazwaKopii();
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  zapiszDateKopii();
}

document.getElementById('eksport').addEventListener('click', ()=>{

});

// Menu „Udostępnij” Androida — np. zapis na Dysku Google w dwóch stuknięciach.
// Bez obsługi udostępniania plików (np. na komputerze) po prostu pobiera plik.
async function wyslijKopie(){
  if(!pomiary.length){ alert('Nie ma jeszcze żadnych pomiarów do wysłania.'); return; }
  // Bez „title”: Dysk Google brał go za nazwę pliku (bez .csv).
  // Typ bez „;charset=…” — z nim Dysk znika z menu Udostępnij (nie rozpoznaje typu).
  const plik = new File([csvDziennika()], nazwaKopii(), {type:'text/csv'});
  if(!(navigator.canShare && navigator.canShare({files:[plik]}))){ pobierzKopie(); return; }
  try{
    await navigator.share({files:[plik]});
    zapiszDateKopii();
  }catch(e){
    if(e.name!=='AbortError') pobierzKopie();   // anulowanie przez użytkownika to nie błąd
  }
}
document.querySelectorAll('[data-akcja=wyslij-kopie]').forEach(b=>b.addEventListener('click', wyslijKopie));
document.getElementById('przypomnienie-kopii').addEventListener('click', e=>{
  if(e.target.closest('button')) wyslijKopie();
});

/* ---------- przypomnienie o kopii ---------- */
const KLUCZ_KOPII = 'ostatnia-kopia-v1';
const DNI_DO_PRZYPOMNIENIA = 5;
function zapiszDateKopii(){
  try{ localStorage.setItem(KLUCZ_KOPII, isoDaty(new Date())); }catch(e){}
  rysujPrzypomnienie();
}
function dniOd(iso){
  const d = new Date(iso+'T12:00:00'), dzis = new Date(); dzis.setHours(12,0,0,0);
  return Math.round((dzis-d)/86400000);
}
function rysujPrzypomnienie(){
  const el = document.getElementById('przypomnienie-kopii');
  let ostatnia = null;
  try{ ostatnia = localStorage.getItem(KLUCZ_KOPII); }catch(e){}
  let tekst = '';
  if(ostatnia){
    const ile = dniOd(ostatnia);
    if(ile >= DNI_DO_PRZYPOMNIENIA) tekst = 'Ostatnia kopia: '+ile+' dni temu.';
  } else if(pomiary.length && dniOd(pomiary[pomiary.length-1].data) >= DNI_DO_PRZYPOMNIENIA){
    tekst = 'Nie masz jeszcze kopii zapasowej pomiarów.';
  }
  el.hidden = !tekst;
  if(tekst) el.innerHTML = '<span>'+tekst+'</span><button type="button">Wyślij kopię</button>';

  const ile = ostatnia ? dniOd(ostatnia) : null;
  document.getElementById('stan-kopii').textContent = ostatnia
    ? 'Ostatnia kopia: '+(ile===0 ? 'dzisiaj' : ile===1 ? 'wczoraj' : ile+' dni temu')+' ('+ostatnia.slice(8,10)+'.'+ostatnia.slice(5,7)+').'
    : 'Na tym telefonie nie zrobiono jeszcze kopii. „Wyślij kopię” otwiera menu Udostępnij — wybierz np. Dysk Google.';
}

// Pola w cudzysłowach mogą zawierać średniki, nowe linie i podwojone cudzysłowy ("").
function parsujCSV(tekst){
  const wiersze = [];
  let wiersz = [], pole = '', wCudzyslowie = false;
  for(let i=0; i<tekst.length; i++){
    const c = tekst[i];
    if(wCudzyslowie){
      if(c==='"'){
        if(tekst[i+1]==='"'){ pole+='"'; i++; }
        else wCudzyslowie = false;
      } else pole += c;
    } else if(c==='"') wCudzyslowie = true;
    else if(c===';'){ wiersz.push(pole); pole=''; }
    else if(c==='\n' || c==='\r'){
      if(c==='\r' && tekst[i+1]==='\n') i++;
      wiersz.push(pole); wiersze.push(wiersz);
      wiersz = []; pole = '';
    } else pole += c;
  }
  if(pole || wiersz.length){ wiersz.push(pole); wiersze.push(wiersz); }
  return wiersze.filter(w=>w.some(p=>p.trim()));
}

document.getElementById('import').addEventListener('click', ()=>document.getElementById('plik').click());
document.getElementById('plik').addEventListener('change', e=>{
  const plik = e.target.files[0]; if(!plik) return;

      if(pomiary.some(x=>x.data===data && x.godzina===godzina && x.skurczowe===s &&
                         x.rozkurczowe===r && x.tetno===tetno)) return;
      const pr = (p[5]||'').trim();
      pomiary.push({
        id: Date.now()+'-'+Math.random().toString(36).slice(2,7),
        data, godzina, skurczowe:s, rozkurczowe:r,
        tetno,
        pora: PORY.includes(pr) ? pr : 'dodatkowy',
        notatka: p[6]||''
      });
      dodane++;
    });
    pomiary.sort((a,b)=> (b.data+b.godzina).localeCompare(a.data+a.godzina));
    zapisz(); odswiez();
    alert(dodane ? 'Wczytano '+ilePomiarow(dodane)+'.' : 'Nie znaleziono nowych pomiarów w tym pliku.');
  };
  czyt.readAsText(plik);
  e.target.value='';
});

/* ---------- raport dla lekarza ---------- */
// Wydruk z wybranego zakresu dat: same dane, bez kategorii i kolorów ocen.
const KLUCZ_PACJENTA = 'raport-pacjent-v1';
const dniKrotko = ['nd','pn','wt','śr','cz','pt','sb'];
function bezpieczny(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function dodajDni(iso, n){ const d = new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return isoDaty(d); }
function dniWOkresie(od, doDnia){ return dniOd(od) - dniOd(doDnia) + 1; }
function dataPL(iso){ return iso.slice(8,10)+'.'+iso.slice(5,7)+'.'+iso.slice(0,4); }
function dataKrotko(iso){ return iso.slice(8,10)+'.'+iso.slice(5,7); }
function wartosc(p){ return p.skurczowe+'/'+p.rozkurczowe; }
function sredniaTekst(s){ return s.ile ? s.skurczowe+'/'+s.rozkurczowe : '—'; }
function ileDni(n){ return n + (n===1 ? ' dzień' : ' dni'); }

// Przy pierwszym wejściu ustawia domyślne 30 dni; potem zostawia wybrany zakres.
function przygotujRaport(){
  if(!document.getElementById('raport-od').value){
    const dzis = isoDaty(new Date());
    document.getElementById('raport-od').value = dodajDni(dzis, -29);
    document.getElementById('raport-do').value = dzis;
    try{ document.getElementById('raport-pacjent').value = localStorage.getItem(KLUCZ_PACJENTA) || ''; }catch(e){}
  }
  rysujRaport();
}
document.getElementById('raport-drukuj').addEventListener('click', ()=>window.print());
['raport-od','raport-do'].forEach(id=>document.getElementById(id).addEventListener('change', rysujRaport));
document.getElementById('raport-pacjent').addEventListener('input', e=>{
  try{ localStorage.setItem(KLUCZ_PACJENTA, e.target.value.trim()); }catch(err){}
  rysujRaport();
});

function rysujRaport(){
  let od = document.getElementById('raport-od').value, doDnia = document.getElementById('raport-do').value;
  const tresc = document.getElementById('raport-tresc');
  if(!od || !doDnia){ tresc.innerHTML = '<p class="pusto">Wybierz zakres dat.</p>'; return; }
  if(od > doDnia) [od, doDnia] = [doDnia, od];
  const pacjent = document.getElementById('raport-pacjent').value.trim();

  const wOkresie = pomiaryZOkresu(od, doDnia).slice().reverse();   // rosnąco w czasie
  const zRytmu = wOkresie.filter(p=>p.pora!=='dodatkowy');
  const dodatkowe = wOkresie.filter(p=>p.pora==='dodatkowy');
  const dniOkresu = dniWOkresie(od, doDnia);

  let html = '<div class="r-naglowek"><h1>Domowe pomiary ciśnienia tętniczego</h1>'+
    (pacjent ? '<div>Pacjent: <b>'+bezpieczny(pacjent)+'</b></div>' : '')+
    '<div>Okres: <b>'+dataPL(od)+' – '+dataPL(doDnia)+'</b> ('+ileDni(dniOkresu)+')</div>'+
    '<div class="r-maly">Wygenerowano '+dataPL(isoDaty(new Date()))+' w aplikacji Dziennik ciśnienia</div></div>';

  if(!wOkresie.length){ tresc.innerHTML = html+'<p class="pusto">Brak pomiarów w wybranym okresie.</p>'; return; }

  html += raportPodsumowanie(zRytmu, dodatkowe, dniOkresu);
  if(dniOkresu > 14) html += raportTygodnie(od, doDnia);
  html += raportWykres(od, doDnia, wOkresie);
  html += raportTabela(zRytmu);
  if(dodatkowe.length) html += raportDodatkowe(dodatkowe);
  html += '<p class="r-stopka">Pomiary wykonane i zapisane przez pacjenta w domu. Średnie obejmują pomiary '+
    'poranne i wieczorne; pomiary dodatkowe, wykonane z powodu objawów, wymieniono osobno. '+
    'Raport przedstawia dane bez ich oceny.</p>';
  tresc.innerHTML = html;
}

function raportPodsumowanie(zRytmu, dodatkowe, dniOkresu){
  const rano = srednie(zRytmu.filter(p=>p.pora==='rano'));
  const wieczor = srednie(zRytmu.filter(p=>p.pora==='wieczór'));
  const razem = srednie(zRytmu);
  const wiersz = (tytul, s) => '<tr><th>'+tytul+'</th><td><b>'+sredniaTekst(s)+'</b>'+
    (s.ile ? ' mmHg <span class="r-maly">· tętno '+s.tetno+' · '+ilePomiarow(s.ile)+'</span>' : '')+'</td></tr>';

  const ranoDni = new Set(zRytmu.filter(p=>p.pora==='rano').map(p=>p.data));
  const zKompletem = new Set(zRytmu.filter(p=>p.pora==='wieczór' && ranoDni.has(p.data)).map(p=>p.data));

  const wgCisnienia = zRytmu.slice().sort((a,b)=> b.skurczowe-a.skurczowe || b.rozkurczowe-a.rozkurczowe);
  const opis = p => '<b>'+wartosc(p)+'</b> <span class="r-maly">'+dniKrotko[new Date(p.data+'T12:00:00').getDay()]+' '+
    dataKrotko(p.data)+', '+p.godzina+' · '+p.pora+'</span>';

  return '<section class="r-sekcja r-podsumowanie"><h2>Podsumowanie</h2><table class="r-tabela r-zwarta">'+
    wiersz('Średnia poranna', rano)+
    wiersz('Średnia wieczorna', wieczor)+
    wiersz('Średnia łączna', razem)+
    (zRytmu.length ?
      '<tr><th>Najwyższy pomiar <span class="r-maly">(rano/wieczór)</span></th><td>'+opis(wgCisnienia[0])+'</td></tr>'+
      '<tr><th>Najniższy pomiar <span class="r-maly">(rano/wieczór)</span></th><td>'+opis(wgCisnienia[wgCisnienia.length-1])+'</td></tr>' : '')+
    '<tr><th>Dni z kompletem pomiarów</th><td><b>'+zKompletem.size+'</b> z '+ileDni(dniOkresu)+
      ' <span class="r-maly">(poranny i wieczorny)</span></td></tr>'+
    '<tr><th>Pomiary dodatkowe</th><td><b>'+dodatkowe.length+'</b>'+
      (dodatkowe.length ? ' <span class="r-maly">(wymienione na końcu raportu)</span>' : '')+'</td></tr>'+
    '</table></section>';
}

// Tygodnie kalendarzowe pon–niedz, przycięte do zakresu raportu.
function raportTygodnie(od, doDnia){
  const dzienTyg = new Date(od+'T12:00:00').getDay();
  let wiersze = '';
  for(let pon = dodajDni(od, -((dzienTyg+6)%7)); pon <= doDnia; pon = dodajDni(pon, 7)){
    const s = pon < od ? od : pon;
    const nd = dodajDni(pon, 6), k = nd > doDnia ? doDnia : nd;
    const lista = pomiaryZOkresu(s, k);
    const r = srednie(lista.filter(p=>p.pora==='rano')), w = srednie(lista.filter(p=>p.pora==='wieczór')), c = srednie(lista);
    const dniTyg = dniWOkresie(s, k);
    wiersze += '<tr><td>'+dataKrotko(s)+'–'+dataKrotko(k)+(dniTyg<7 ? ' <span class="r-maly">('+ileDni(dniTyg)+')</span>' : '')+'</td>'+
      '<td>'+sredniaTekst(r)+'</td><td>'+sredniaTekst(w)+'</td><td><b>'+sredniaTekst(c)+'</b></td><td>'+c.tetno+'</td></tr>';
  }
  return '<section class="r-sekcja r-tygodnie"><h2>Średnie tygodniowe</h2><table class="r-tabela">'+
    '<thead><tr><th>Tydzień</th><th>Rano</th><th>Wieczór</th><th>Łącznie</th><th>Tętno</th></tr></thead>'+
    '<tbody>'+wiersze+'</tbody></table></section>';
}

// Oś X to czas (dni zakresu), nie kolejne pomiary — luki w pomiarach są widoczne.
function raportWykres(od, doDnia, lista){
  const W=700, H=240, ml=34, mr=8, mt=8, mb=22;
  const dniOkresu = dniWOkresie(od, doDnia);
  const wartosci = lista.flatMap(p=>[p.skurczowe,p.rozkurczowe]);
  const min = Math.floor((Math.min(...wartosci)-5)/10)*10, max = Math.ceil((Math.max(...wartosci)+5)/10)*10;
  const krok = max-min > 80 ? 20 : 10;
  const x = p => {
    const ulamek = (parseInt(p.godzina.slice(0,2),10)*60 + parseInt(p.godzina.slice(3,5),10)) / 1440;
    return ml + (dniWOkresie(od, p.data) - 1 + ulamek) * (W-ml-mr) / dniOkresu;
  };
  const y = v => mt + (max-v)*(H-mt-mb)/(max-min);

  let svg = '';
  for(let v=min; v<=max; v+=krok){
    svg += '<line x1="'+ml+'" y1="'+y(v)+'" x2="'+(W-mr)+'" y2="'+y(v)+'" stroke="#d3dcd9" stroke-width="1"/>'+
           '<text x="'+(ml-6)+'" y="'+(y(v)+4)+'" font-size="11" fill="#5d6f6a" text-anchor="end">'+v+'</text>';
  }
  for(let i=0; i<dniOkresu; i++){        // podpisy osi przy poniedziałkach
    const d = dodajDni(od, i);
    if(new Date(d+'T12:00:00').getDay()!==1) continue;
    const px = ml + i*(W-ml-mr)/dniOkresu;
    svg += '<line x1="'+px+'" y1="'+mt+'" x2="'+px+'" y2="'+(H-mb)+'" stroke="#e2e9e7" stroke-width="1"/>'+
           '<text x="'+px+'" y="'+(H-6)+'" font-size="11" fill="#5d6f6a" text-anchor="middle">'+dataKrotko(d)+'</text>';
  }

  const seria = (pora, kolor, kreska, wypelnienie) => {
    const pkt = lista.filter(p=>p.pora===pora);
    if(!pkt.length) return '';
    let out = '';
    ['skurczowe','rozkurczowe'].forEach(pole=>{
      if(pkt.length > 1) out += '<path d="'+pkt.map((p,i)=>(i?'L':'M')+x(p).toFixed(1)+' '+y(p[pole]).toFixed(1)).join(' ')+
        '" fill="none" stroke="'+kolor+'" stroke-width="1.6" stroke-linejoin="round"'+(kreska?' stroke-dasharray="'+kreska+'"':'')+'/>';
      out += pkt.map(p=>'<circle cx="'+x(p).toFixed(1)+'" cy="'+y(p[pole]).toFixed(1)+'" r="2.6" fill="'+wypelnienie+'" stroke="'+kolor+'" stroke-width="1.2"/>').join('');
    });
    return out;
  };
  svg += seria('rano', '#123a33', '', '#123a33') + seria('wieczór', '#5d6f6a', '5 3', '#ffffff');
  // dodatkowe: same punkty (romby), bez linii
  lista.filter(p=>p.pora==='dodatkowy').forEach(p=>['skurczowe','rozkurczowe'].forEach(pole=>{
    const cx = x(p), cy = y(p[pole]);
    svg += '<path d="M'+cx.toFixed(1)+' '+(cy-4.5).toFixed(1)+' l4.5 4.5 l-4.5 4.5 l-4.5 -4.5 z" fill="#ffffff" stroke="#12241f" stroke-width="1.3"/>';
  }));

  return '<section class="r-sekcja r-wykres"><h2>Przebieg</h2>'+
    '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Wykres ciśnienia w wybranym okresie">'+svg+'</svg>'+
    '<div class="r-legenda">'+
      '<span><svg width="26" height="10"><line x1="1" y1="5" x2="25" y2="5" stroke="#123a33" stroke-width="1.6"/><circle cx="13" cy="5" r="2.6" fill="#123a33"/></svg>rano</span>'+
      '<span><svg width="26" height="10"><line x1="1" y1="5" x2="25" y2="5" stroke="#5d6f6a" stroke-width="1.6" stroke-dasharray="5 3"/><circle cx="13" cy="5" r="2.6" fill="#fff" stroke="#5d6f6a" stroke-width="1.2"/></svg>wieczór</span>'+
      '<span><svg width="14" height="12"><path d="M7 1.5 l4.5 4.5 l-4.5 4.5 l-4.5 -4.5 z" fill="#fff" stroke="#12241f" stroke-width="1.3"/></svg>dodatkowy</span>'+
      '<span>górna linia — skurczowe, dolna — rozkurczowe</span>'+
    '</div></section>';
}

function raportTabela(zRytmu){
  const wgDni = new Map();
  zRytmu.forEach(p=>{
    if(!wgDni.has(p.data)) wgDni.set(p.data, {rano:[], 'wieczór':[]});
    wgDni.get(p.data)[p.pora].push(p);
  });
  const komorka = lista => lista.length ? lista.map(p=>
    '<div class="r-pomiar"><b>'+wartosc(p)+'</b>'+(p.tetno ? ' · '+p.tetno : '')+' <span class="r-maly">'+p.godzina+'</span>'+
    (p.notatka ? '<div class="r-notatka">'+bezpieczny(p.notatka)+'</div>' : '')+'</div>').join('') : '<span class="r-maly">—</span>';
  let wiersze = '';
  wgDni.forEach((pory, d)=>{
    wiersze += '<tr><td>'+dniKrotko[new Date(d+'T12:00:00').getDay()]+' '+dataKrotko(d)+'</td>'+
      '<td>'+komorka(pory.rano)+'</td><td>'+komorka(pory['wieczór'])+'</td></tr>';
  });
  return '<section class="r-sekcja"><h2>Pomiary dzienne</h2>'+
    '<p class="r-maly">ciśnienie mmHg · tętno ud/min · godzina</p><table class="r-tabela r-dzienna">'+
    '<thead><tr><th>Dzień</th><th>Rano</th><th>Wieczór</th></tr></thead><tbody>'+wiersze+'</tbody></table></section>';
}

function raportDodatkowe(dodatkowe){
  return '<section class="r-sekcja"><h2>Pomiary dodatkowe</h2><table class="r-tabela">'+
    '<thead><tr><th>Dzień</th><th>Godzina</th><th>Ciśnienie</th><th>Tętno</th><th>Powód</th></tr></thead><tbody>'+
    dodatkowe.map(p=>'<tr><td>'+dniKrotko[new Date(p.data+'T12:00:00').getDay()]+' '+dataKrotko(p.data)+'</td><td>'+p.godzina+
      '</td><td><b>'+wartosc(p)+'</b></td><td>'+(p.tetno||'—')+'</td><td>'+(p.notatka ? bezpieczny(p.notatka) : '<span class="r-maly">—</span>')+'</td></tr>').join('')+
    '</tbody></table></section>';
}

/* ---------- start ---------- */
if(history.state) history.replaceState(null, '');   // po przeładowaniu zawsze start od „Pomiaru”
wczytaj(); terazDoPol(); odswiez();
if('serviceWorker' in navigator){
  // Strona startuje z cache; nowa wersja pobiera się w tle i przejmuje stronę chwilę później.
  // Wtedy przeładowujemy — chyba że użytkownik jest w trakcie wpisywania pomiaru.
  const byloSterowane = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    const wTrakcieWpisu = ['skurczowe','rozkurczowe','tetno','notatka'].some(id=>document.getElementById(id).value);
    if(byloSterowane && !wTrakcieWpisu && strona!=='raport') location.reload();
  });
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
